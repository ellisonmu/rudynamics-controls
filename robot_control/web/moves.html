<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leg Moves</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <span class="brand">Leg Control</span>
    <nav>
      <a href="/manual">Manual</a>
      <a href="/moves" class="active">Moves</a>
    </nav>
    <span class="spacer"></span>
    <div class="controls">
      <button id="btn-calibrate">Calibrate</button>
      <button id="btn-clear" style="display:none">Clear fault</button>
      <button id="btn-disable">Disable</button>
      <button id="btn-enable" class="primary">Enable</button>
      <button id="btn-estop" class="estop" title="Space bar">E-STOP</button>
    </div>
  </header>
  <div class="status">
    <span id="mode-chip" class="chip">offline</span>
    <span id="status-msg"></span>
    <span class="spacer"></span>
    <span id="calib"></span> · loop <span id="loop-hz" class="mono">--</span>
  </div>

  <main>
    <section>
      <div class="card">
        <h2>Moves</h2>
        <div class="moves-grid" id="moves"></div>
      </div>
      <div class="card">
        <h2 id="params-title">Settings</h2>
        <div id="params"></div>
        <div class="play-row">
          <button id="btn-play" class="primary">Play</button>
          <button id="btn-stop">Stop &amp; hold</button>
        </div>
        <p class="hint">Every move eases in from the current pose. Changing a setting while a move is playing restarts it. <kbd>Space</kbd> = E-STOP.</p>
      </div>
    </section>

    <aside>
      <div class="card">
        <h2>Leg</h2>
        <div class="views">
          <div class="view"><div class="view-label">Side · front →</div><svg id="side"></svg></div>
          <div class="view"><div class="view-label">Front · ← left</div><svg id="front"></svg></div>
        </div>
        <div class="legend">
          <span><i style="background:var(--accent)"></i>measured</span>
          <span><i style="background:var(--ghost)"></i>commanded</span>
          <span><i style="background:var(--accent);opacity:.35"></i>foot path</span>
        </div>
        <div class="footpos" id="footpos">foot: --</div>
        <div class="footpos" id="motion-status">no move playing</div>
      </div>
    </aside>
  </main>
  <div id="toast" class="toast"></div>

  <script src="/panel.js"></script>
  <script>
    const { api, fmt } = Panel;
    let motions = [];
    let selected = null;
    let values = {};          // per-motion parameter values: {key: {param: value}}
    let views = null;
    let playing = null;

    function buildMoves(cfg) {
      motions = cfg.motions;
      const grid = document.getElementById("moves");
      grid.innerHTML = "";
      for (const m of motions) {
        values[m.key] = Object.fromEntries(m.params.map((p) => [p.key, p.default]));
        const b = document.createElement("button");
        b.className = "move";
        b.dataset.key = m.key;
        b.innerHTML = `
          <span class="move-title">${m.label}<span class="badge">${m.cyclic ? "loop" : "once"}</span></span>
          <span class="move-desc">${m.description}</span>`;
        b.addEventListener("click", () => select(m.key));
        b.addEventListener("dblclick", () => { select(m.key); play(); });
        grid.appendChild(b);
      }
      select(motions[0].key);
    }

    function select(key) {
      selected = motions.find((m) => m.key === key);
      document.querySelectorAll(".move").forEach((b) => b.classList.toggle("selected", b.dataset.key === key));
      document.getElementById("params-title").textContent = `${selected.label} settings`;
      const box = document.getElementById("params");
      box.innerHTML = "";
      for (const p of selected.params) {
        const row = document.createElement("div");
        row.className = "param";
        const show = (v) => `${(+v).toFixed(p.step < 0.1 ? 2 : 1)} ${p.unit}`;
        row.innerHTML = `
          <div class="param-head"><span>${p.label}</span><span>${show(values[key][p.key])}</span></div>
          <input type="range" min="${p.lo}" max="${p.hi}" step="${p.step}" value="${values[key][p.key]}">`;
        const input = row.querySelector("input");
        input.addEventListener("input", () => {
          values[key][p.key] = +input.value;
          row.querySelector(".param-head span:last-child").textContent = show(input.value);
        });
        input.addEventListener("change", () => {
          if (playing === key) play();
        });
        box.appendChild(row);
      }
    }

    function play() {
      if (!selected) return;
      api("/api/motion", { key: selected.key, params: values[selected.key] });
    }

    document.getElementById("btn-play").addEventListener("click", play);
    document.getElementById("btn-stop").addEventListener("click", () => api("/api/stop_motion", {}));

    function render(s) {
      const enabled = !!s && (s.mode === "manual" || s.mode === "motion");
      document.getElementById("btn-play").disabled = !enabled;
      document.getElementById("btn-stop").disabled = !s || s.mode !== "motion";
      playing = s && s.motion ? s.motion.key : null;
      document.querySelectorAll(".move").forEach((b) => b.classList.toggle("playing", b.dataset.key === playing));
      let status = "no move playing";
      if (s && s.motion) {
        status = `${s.motion.label}: ${s.motion.done ? "finished, holding" : `t = ${fmt(s.motion.t)} s`}`;
      } else if (s && !enabled) {
        status = "press Enable to play moves";
      }
      document.getElementById("motion-status").textContent = status;
      if (views && s) {
        Panel.drawLeg(views.side, "side", s, { trail: true });
        Panel.drawLeg(views.front, "front", s, { trail: true });
      }
      document.getElementById("footpos").textContent = Panel.footText(s);
    }

    Panel.start({
      onConfig(cfg) {
        buildMoves(cfg);
        views = {
          side: Panel.makeView(document.getElementById("side"), cfg.geometry),
          front: Panel.makeView(document.getElementById("front"), cfg.geometry),
        };
      },
      onState: render,
    });
  </script>
</body>
</html>
